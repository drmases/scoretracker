<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scoretracker</title>
<meta name="apple-mobile-web-app-title" content="Scoretracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f1a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=20260725j">
</head>
<body>

<div id="app">
  <div id="board">
    <div id="headerRow" class="row header-row">
      <div class="col col-game">
        <input id="gameNameInput" type="text" placeholder="Game name" autocomplete="off">
      </div>
      <div class="col col-round">
        <span class="round-stepper-label">Score Round</span>
      </div>
      <div class="col col-score">
        <div class="round-stepper">
          <button id="roundMinus" class="step-btn" aria-label="Delete round">&minus;</button>
          <span id="roundNumber" class="round-number">1</span>
          <button id="roundPlus" class="step-btn" aria-label="Next round">+</button>
        </div>
      </div>
      <div class="col col-total header-label">Total Score</div>
    </div>

    <div id="playerRows"></div>

    <button id="addPlayerBtn" class="add-player-btn">
      <span class="plus">+</span> Add Player
    </button>
  </div>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <div id="drawer" class="drawer">
    <button id="drawerTab" class="drawer-tab" aria-label="Open menu"><span id="drawerTabIcon" class="drawer-tab-icon">&#8249;</span></button>

    <div class="drawer-content">
      <div class="drawer-section">
        <h3 class="drawer-heading">Clear</h3>
        <button id="clearAllBtn" class="drawer-item">Clear All</button>
        <button id="clearResultBtn" class="drawer-item">Clear Result</button>
        <button id="clearPlayersBtn" class="drawer-item">Clear Players</button>
      </div>

      <div class="drawer-section">
        <h3 class="drawer-heading">Sort by</h3>
        <button id="sortLeaderBtn" class="drawer-item" data-mode="leader">Auto Leader</button>
        <button id="sortPlayerOrderBtn" class="drawer-item" data-mode="insertion">Player Order</button>
        <button id="sortRandomBtn" class="drawer-item" data-mode="random">New Random</button>
      </div>

      <div class="drawer-section">
        <h3 class="drawer-heading">View</h3>
        <label class="switch-row">
          <span class="switch-label">Rounds</span>
          <span class="switch">
            <input type="checkbox" id="roundsToggleInput" class="switch-input">
            <span class="switch-slider"></span>
          </span>
        </label>
        <label class="switch-row">
          <span class="switch-label">Colors</span>
          <span class="switch">
            <input type="checkbox" id="colorsToggleInput" class="switch-input">
            <span class="switch-slider"></span>
          </span>
        </label>
      </div>

      <button id="saveBtn" class="drawer-action">Save Game</button>
      <button id="historyBtn" class="drawer-action">History</button>
    </div>
  </div>

  <div id="historyOverlay" class="drawer-overlay"></div>
  <div id="historyPanel" class="history-panel">
    <div class="history-panel-header">
      <h2>History</h2>
      <button id="historyCloseBtn" class="history-close-btn" aria-label="Close history">&times;</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>

  <div id="confirmOverlay" class="drawer-overlay"></div>
  <div id="confirmModal" class="confirm-modal">
    <p id="confirmMessage" class="confirm-message"></p>
    <div class="confirm-actions">
      <button id="confirmYes" class="confirm-btn confirm-yes">Yes</button>
      <button id="confirmNo" class="confirm-btn confirm-no">No</button>
    </div>
  </div>

  <div id="playerEditOverlay" class="drawer-overlay"></div>
  <div id="playerEditModal" class="player-edit-modal">
    <h3 id="playerEditTitle" class="player-edit-title">Player</h3>
    <div id="colorSwatchGrid" class="color-swatch-grid"></div>
    <button id="playerEditDeleteBtn" class="player-edit-delete-btn">Delete Player</button>
    <button id="playerEditCloseBtn" class="player-edit-close-btn">Close</button>
  </div>
</div>

<script src="script.js?v=20260725j"></script>
</body>
</html>
